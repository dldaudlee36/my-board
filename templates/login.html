<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 | 나만의 게시판</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <a href="/" class="brand-logo">📋 나만의 게시판</a>
            <nav class="nav-links">
                <a href="/">게시글 목록</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="card login-card">
            <h2>로그인</h2>
            <p class="subtitle">아이디와 비밀번호를 입력하여 로그인 판정을 확인하세요.</p>

            <div id="result-box" class="alert hidden" role="alert"></div>

            <form id="login-form">
                <div class="form-group">
                    <label for="username">아이디</label>
                    <input type="text" id="username" name="username" placeholder="아이디를 입력하세요" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">비밀번호</label>
                    <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요" required>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="login-btn">로그인</button>
                    <a href="/" class="btn btn-secondary">게시글 목록으로</a>
                </div>
            </form>
        </div>
    </main>

    <script>
        const form = document.getElementById("login-form");
        const resultBox = document.getElementById("result-box");
        const loginBtn = document.getElementById("login-btn");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;

            resultBox.className = "alert hidden";
            resultBox.textContent = "";
            loginBtn.disabled = true;
            loginBtn.textContent = "확인 중...";

            try {
                const response = await fetch("/auth/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    resultBox.className = "alert alert-success";
                    resultBox.textContent = `🎉 ${data.user.username}님, 환영합니다! (${data.message})`;
                } else {
                    resultBox.className = "alert alert-error";
                    resultBox.textContent = `⚠️ ${data.error || "로그인에 실패했습니다."}`;
                }
            } catch (err) {
                resultBox.className = "alert alert-error";
                resultBox.textContent = "🚨 서버와 통신하지 못했습니다. 서버 상태를 확인해 주세요.";
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = "로그인";
            }
        });
    </script>
</body>
</html>
