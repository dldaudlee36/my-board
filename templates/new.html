<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>새 게시글 작성 | 나만의 게시판</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <a href="/" class="brand-logo">📋 나만의 게시판</a>
            <nav class="nav-links">
                <a href="/">목록</a>
                <a href="/login">로그인</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="card">
            <h2>새 게시글 작성</h2>
            <p class="subtitle">새로운 게시글의 제목과 내용을 작성해 주세요.</p>

            {% if error %}
            <div class="alert alert-error" role="alert">
                {{ error }}
            </div>
            {% endif %}

            <form action="/board/new" method="post">
                <div class="form-group">
                    <label for="title">제목</label>
                    <input type="text" id="title" name="title" value="{{ title }}" placeholder="제목을 입력하세요" autofocus>
                </div>
                <div class="form-group">
                    <label for="body">내용</label>
                    <textarea id="body" name="body" rows="8" placeholder="내용을 입력하세요">{{ body }}</textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">게시글 저장</button>
                    <a href="/" class="btn btn-secondary">취소</a>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
